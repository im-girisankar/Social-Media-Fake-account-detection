[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fakedetect"
version = "0.1.0"
description = "Instagram fake-account detection — reproducible ML pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
nn  = ["tensorflow>=2.13"]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
fakedetect = "fakedetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
addopts    = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
